# Virtual Host Configuration for Click2Serve Kiosk
# Place this file in C:\xampp\apache\conf\extra\ and include it in httpd.conf

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/Click2Serve/Click2Serve/public"
    
    <Directory "C:/xampp/htdocs/Click2Serve/Click2Serve/public">
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    
    # Redirect root to kiosk
    RewriteEngine On
    RewriteRule ^/$ /Click2Serve/public/ [R=301,L]
    
    # Handle Laravel routing
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ /Click2Serve/public/index.php [QSA,L]
</VirtualHost>



